<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음성 인식 → 영어 번역 → 음성 출력</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 32px 16px;
    background: #f4f5f7; color: #1f2430;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 940px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button { border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #start { background: #2563eb; color: #fff; }
  #stop  { background: #dc2626; color: #fff; }
  #clear, #copy, #replay, #shutup { background: #e5e7eb; color: #374151; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; max-width: 220px; }
  label.chk { font-size: 13px; color: #374151; display: flex; align-items: center; gap: 5px; }
  input[type=range] { width: 110px; vertical-align: middle; }
  #status { font-size: 13px; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; background: #f3f4f6; color: #4b5563; }
  #status.rec { background: #fef2f2; color: #b91c1c; font-weight: 600; }
  #status.warn { background: #fffbeb; color: #92400e; }
  #status.spk { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 680px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 { font-size: 13px; margin: 0 0 6px; color: #6b7280; font-weight: 600; }
  .box {
    min-height: 250px; max-height: 250px; overflow-y: auto; padding: 14px;
    border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 15px; line-height: 1.75; word-break: break-word;
  }
  #enBox { background: #f8fafc; }
  .interim { color: #9ca3af; }
  .pending { color: #9ca3af; font-style: italic; }
  .seg { cursor: pointer; border-radius: 3px; padding: 1px 2px; }
  .seg:hover { background: #e0e7ff; }
  .seg.speaking { background: #bfdbfe; }
  .meta { font-size: 12px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>음성 인식 → 영어 번역 → 음성 출력</h1>
  <p class="sub">SpeechRecognition + Translator API + speechSynthesis · 외부 API 키 불필요</p>

  <div class="card">
    <div class="row">
      <button id="start">🎤 녹음 시작</button>
      <button id="stop" disabled>■ 중지</button>
      <button id="replay">🔊 전체 읽기</button>
      <button id="shutup">🔇 음성 정지</button>
      <button id="clear">지우기</button>
      <button id="copy">영어 복사</button>
    </div>
    <div class="row">
      <select id="lang">
        <option value="ko-KR" data-src="ko">한국어</option>
        <option value="ja-JP" data-src="ja">日本語</option>
        <option value="zh-CN" data-src="zh">中文</option>
        <option value="es-ES" data-src="es">Español</option>
        <option value="fr-FR" data-src="fr">Français</option>
      </select>
      <select id="voice"><option>음성 로딩 중...</option></select>
      <label class="chk">속도 <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1"><span id="rateV">1.0</span></label>
      <label class="chk"><input type="checkbox" id="cont" checked> 연속 인식</label>
      <label class="chk"><input type="checkbox" id="auto" checked> 자동 읽기</label>
    </div>

    <div id="status">대기 중</div>

    <div class="panes">
      <div class="pane">
        <h2 id="srcTitle">원문 (한국어)</h2>
        <div id="koBox" class="box"></div>
      </div>
      <div class="pane">
        <h2>English — 문장 클릭 시 다시 읽기</h2>
        <div id="enBox" class="box"></div>
      </div>
    </div>
    <div class="meta"><span id="count">0</span>문장 번역됨</div>
  </div>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis;
  const $ = id => document.getElementById(id);
  const startBtn = $('start'), stopBtn = $('stop'),
        koBox = $('koBox'), enBox = $('enBox'), status = $('status');

  let recognition = null, translator = null, translatorLang = null;
  let srcSentences = [], enSentences = [];
  let manualStop = false, transQueue = Promise.resolve();
  let speakQueue = [], speaking = false, speakingIdx = -1;
  let enVoices = [];

  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const srcCode = () => $('lang').selectedOptions[0].dataset.src;
  const setStatus = (t, c) => { status.textContent = t; status.className = c || ''; };

  if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome/Edge를 사용하세요.', 'warn'); startBtn.disabled = true; return; }
  const hasTranslator = 'Translator' in self;
  if (!hasTranslator) setStatus('Translator API 미지원 — 음성 인식만 동작합니다 (Chrome 138+ 필요)', 'warn');
  if (!synth) setStatus('이 브라우저는 음성 합성을 지원하지 않습니다.', 'warn');

  /* ---------- TTS 음성 목록 ---------- */
  function loadVoices() {
    enVoices = (synth ? synth.getVoices() : []).filter(v => v.lang.toLowerCase().startsWith('en'));
    if (!enVoices.length) return;
    $('voice').innerHTML = enVoices
      .map((v, i) => `<option value="${i}">${esc(v.name)} (${v.lang})</option>`).join('');
    // 자연스러운 음성 우선 선택
    const pref = enVoices.findIndex(v => /natural|google|samantha|aria/i.test(v.name));
    $('voice').value = pref >= 0 ? pref : 0;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  /* ---------- TTS 큐 (한 문장씩 순차 재생) ---------- */
  function speak(text, idx) {
    if (!synth || !text) return;
    speakQueue.push({ text, idx });
    drainSpeak();
  }

  function drainSpeak() {
    if (speaking || !speakQueue.length) return;
    const { text, idx } = speakQueue.shift();
    const u = new SpeechSynthesisUtterance(text);
    const v = enVoices[+$('voice').value];
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'en-US';
    u.rate = parseFloat($('rate').value);

    speaking = true;
    speakingIdx = idx;
    render('');
    setStatus('🔊 읽는 중: ' + text.slice(0, 50), 'spk');

    const done = () => {
      speaking = false;
      speakingIdx = -1;
      render('');
      if (speakQueue.length) drainSpeak();
      else if (!stopBtn.disabled) setStatus('● 듣는 중... 말씀하세요', 'rec');
      else setStatus('대기 중');
    };
    u.onend = done;
    u.onerror = done;
    synth.speak(u);
  }

  function stopSpeak() {
    speakQueue = [];
    speakingIdx = -1;
    if (synth) synth.cancel();
    speaking = false;
    render('');
  }

  /* ---------- 번역기 ---------- */
  async function getTranslator() {
    const src = srcCode();
    if (translator && translatorLang === src) return translator;
    if (!hasTranslator) return null;

    const opts = { sourceLanguage: src, targetLanguage: 'en' };
    const avail = await Translator.availability(opts);
    if (avail === 'unavailable') { setStatus(`${src} → en 번역 모델을 사용할 수 없습니다.`, 'warn'); return null; }
    if (avail !== 'available') setStatus('번역 모델 다운로드 중... (최초 1회)', 'warn');

    translator = await Translator.create({
      ...opts,
      monitor(m) {
        m.addEventListener('downloadprogress', e =>
          setStatus(`번역 모델 다운로드 ${Math.round(e.loaded * 100)}%`, 'warn'));
      }
    });
    translatorLang = src;
    return translator;
  }

  /* ---------- 렌더링 ---------- */
  function render(interim) {
    koBox.innerHTML = srcSentences.map(esc).join(' ') +
      (interim ? ' <span class="interim">' + esc(interim) + '</span>' : '');
    enBox.innerHTML = enSentences.map((s, i) =>
      s === null
        ? '<span class="pending">번역 중...</span>'
        : `<span class="seg${i === speakingIdx ? ' speaking' : ''}" data-i="${i}">${esc(s)}</span>`
    ).join(' ');
    $('count').textContent = enSentences.filter(s => s !== null).length;
    koBox.scrollTop = koBox.scrollHeight;
    enBox.scrollTop = enBox.scrollHeight;
  }

  /* ---------- 번역 큐 (순서 보장) ---------- */
  function enqueueTranslate(text, idx) {
    transQueue = transQueue.then(async () => {
      try {
        const tr = await getTranslator();
        enSentences[idx] = tr ? await tr.translate(text) : '[번역 불가]';
      } catch (e) {
        enSentences[idx] = '[번역 오류]';
      }
      render('');
      if ($('auto').checked && !/^\[/.test(enSentences[idx])) speak(enSentences[idx], idx);
    });
  }

  /* ---------- 음성 인식 ---------- */
  function build() {
    const r = new SR();
    r.lang = $('lang').value;
    r.continuous = $('cont').checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      setStatus('● 듣는 중... 말씀하세요', 'rec');
      startBtn.disabled = true; stopBtn.disabled = false;
    };

    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) {
          if (!t) continue;
          srcSentences.push(t);
          enSentences.push(null);
          enqueueTranslate(t, enSentences.length - 1);
        } else interim += t;
      }
      render(interim);
    };

    r.onerror = e => {
      const msg = {
        'not-allowed': '마이크 권한이 거부되었습니다.',
        'no-speech': '음성이 감지되지 않았습니다.',
        'audio-capture': '마이크를 찾을 수 없습니다.',
        'network': '네트워크 오류가 발생했습니다.'
      }[e.error] || ('오류: ' + e.error);
      setStatus(msg, 'warn');
      if (e.error === 'not-allowed') manualStop = true;
    };

    r.onend = () => {
      if (!manualStop && $('cont').checked) { try { r.start(); return; } catch (_) {} }
      startBtn.disabled = false; stopBtn.disabled = true;
      if (!speaking) setStatus('대기 중');
      render('');
    };

    return r;
  }

  /* ---------- 이벤트 ---------- */
  startBtn.onclick = async () => {
    manualStop = false;
    if (synth) synth.resume();            // 일부 브라우저의 suspended 상태 해제
    await getTranslator();
    recognition = build();
    try { recognition.start(); } catch (e) { setStatus('시작 실패: ' + e.message, 'warn'); }
  };

  stopBtn.onclick = () => { manualStop = true; if (recognition) recognition.stop(); };
  $('shutup').onclick = stopSpeak;

  $('replay').onclick = () => {
    stopSpeak();
    enSentences.forEach((s, i) => { if (s && !/^\[/.test(s)) speak(s, i); });
  };

  enBox.onclick = e => {
    const seg = e.target.closest('.seg');
    if (!seg) return;
    stopSpeak();
    speak(enSentences[+seg.dataset.i], +seg.dataset.i);
  };

  $('clear').onclick = () => { stopSpeak(); srcSentences = []; enSentences = []; render(''); };

  $('copy').onclick = () => {
    navigator.clipboard.writeText(enSentences.filter(s => s && !/^\[/.test(s)).join(' '))
      .then(() => { const old = status.textContent; setStatus('영어 번역문이 복사되었습니다.');
        setTimeout(() => setStatus(old), 1500); });
  };

  $('rate').oninput = () => { $('rateV').textContent = parseFloat($('rate').value).toFixed(1); };

  $('lang').onchange = () => {
    translator = null; translatorLang = null;
    $('srcTitle').textContent = '원문 (' + $('lang').selectedOptions[0].textContent + ')';
    if (recognition) { manualStop = true; recognition.stop(); }
  };
})();
</script>
</body>
</html>
