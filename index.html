<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음성 인식 + 영어 번역</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0; padding: 32px 16px;
    background: #f4f5f7; color: #1f2430;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button { border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #start { background: #2563eb; color: #fff; }
  #stop  { background: #dc2626; color: #fff; }
  #clear, #copy { background: #e5e7eb; color: #374151; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  label.chk { font-size: 13px; color: #374151; display: flex; align-items: center; gap: 5px; }
  #status { font-size: 13px; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; background: #f3f4f6; color: #4b5563; }
  #status.rec { background: #fef2f2; color: #b91c1c; font-weight: 600; }
  #status.warn { background: #fffbeb; color: #92400e; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 680px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 { font-size: 13px; margin: 0 0 6px; color: #6b7280; font-weight: 600; letter-spacing: .3px; }
  .box {
    min-height: 260px; max-height: 260px; overflow-y: auto; padding: 14px;
    border: 1px solid #d1d5db; border-radius: 8px; background: #fff;
    font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  #enBox { background: #f8fafc; }
  .interim { color: #9ca3af; }
  .pending { color: #9ca3af; font-style: italic; }
  .meta { font-size: 12px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>음성 인식 + 영어 번역</h1>
  <p class="sub">Web Speech API + 온디바이스 Translator API · 외부 API 키 불필요</p>

  <div class="card">
    <div class="row">
      <button id="start">🎤 녹음 시작</button>
      <button id="stop" disabled>■ 중지</button>
      <button id="clear">지우기</button>
      <button id="copy">영어 복사</button>
      <select id="lang">
        <option value="ko-KR" data-src="ko">한국어</option>
        <option value="ja-JP" data-src="ja">日本語</option>
        <option value="zh-CN" data-src="zh">中文</option>
        <option value="es-ES" data-src="es">Español</option>
        <option value="fr-FR" data-src="fr">Français</option>
      </select>
      <label class="chk"><input type="checkbox" id="cont" checked> 연속 인식</label>
    </div>

    <div id="status">대기 중</div>

    <div class="panes">
      <div class="pane">
        <h2 id="srcTitle">원문 (한국어)</h2>
        <div id="koBox" class="box"></div>
      </div>
      <div class="pane">
        <h2>English</h2>
        <div id="enBox" class="box"></div>
      </div>
    </div>
    <div class="meta"><span id="count">0</span>문장 번역됨</div>
  </div>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = id => document.getElementById(id);
  const startBtn = $('start'), stopBtn = $('stop'),
        koBox = $('koBox'), enBox = $('enBox'), status = $('status');

  let recognition = null, translator = null, translatorLang = null;
  let srcSentences = [], enSentences = [];
  let manualStop = false, queue = Promise.resolve();

  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const srcCode = () => $('lang').selectedOptions[0].dataset.src;

  if (!SR) {
    status.textContent = '이 브라우저는 Web Speech API를 지원하지 않습니다. Chrome 또는 Edge를 사용하세요.';
    status.className = 'warn';
    startBtn.disabled = true;
    return;
  }

  const hasTranslator = 'Translator' in self;
  if (!hasTranslator) {
    status.textContent = '번역 엔진(Translator API) 미지원 브라우저입니다. 음성 인식만 동작합니다. (Chrome 138+ 필요)';
    status.className = 'warn';
  }

  /* ---------- 번역기 준비 (온디바이스 모델 다운로드 포함) ---------- */
  async function getTranslator() {
    const src = srcCode();
    if (translator && translatorLang === src) return translator;
    if (!hasTranslator) return null;

    const opts = { sourceLanguage: src, targetLanguage: 'en' };
    const avail = await Translator.availability(opts);
    if (avail === 'unavailable') {
      status.textContent = `${src} → en 번역 모델을 사용할 수 없습니다.`;
      status.className = 'warn';
      return null;
    }
    if (avail !== 'available') {
      status.textContent = '번역 모델 다운로드 중... (최초 1회)';
      status.className = 'warn';
    }

    translator = await Translator.create({
      ...opts,
      monitor(m) {
        m.addEventListener('downloadprogress', e => {
          status.textContent = `번역 모델 다운로드 ${Math.round(e.loaded * 100)}%`;
        });
      }
    });
    translatorLang = src;
    return translator;
  }

  /* ---------- 렌더링 ---------- */
  function render(interim) {
    koBox.innerHTML = srcSentences.map(esc).join(' ') +
      (interim ? ' <span class="interim">' + esc(interim) + '</span>' : '');
    enBox.innerHTML = enSentences
      .map(s => s === null ? '<span class="pending">번역 중...</span>' : esc(s))
      .join(' ');
    $('count').textContent = enSentences.filter(s => s !== null).length;
    koBox.scrollTop = koBox.scrollHeight;
    enBox.scrollTop = enBox.scrollHeight;
  }

  /* ---------- 문장 단위 순차 번역 ---------- */
  function enqueue(text, idx) {
    queue = queue.then(async () => {
      try {
        const tr = await getTranslator();
        enSentences[idx] = tr ? await tr.translate(text) : '[번역 불가]';
      } catch (e) {
        enSentences[idx] = '[번역 오류]';
      }
      render('');
    });
  }

  /* ---------- 음성 인식 ---------- */
  function build() {
    const r = new SR();
    r.lang = $('lang').value;
    r.continuous = $('cont').checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      status.textContent = '● 듣는 중... 말씀하세요';
      status.className = 'rec';
      startBtn.disabled = true; stopBtn.disabled = false;
    };

    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) {
          if (!t) continue;
          srcSentences.push(t);
          enSentences.push(null);          // 자리 확보 → 순서 보장
          enqueue(t, enSentences.length - 1);
        } else interim += t;
      }
      render(interim);
    };

    r.onerror = e => {
      const msg = {
        'not-allowed': '마이크 권한이 거부되었습니다.',
        'no-speech': '음성이 감지되지 않았습니다.',
        'audio-capture': '마이크를 찾을 수 없습니다.',
        'network': '네트워크 오류가 발생했습니다.'
      }[e.error] || ('오류: ' + e.error);
      status.textContent = msg;
      status.className = 'warn';
      if (e.error === 'not-allowed') manualStop = true;
    };

    r.onend = () => {
      if (!manualStop && $('cont').checked) {
        try { r.start(); return; } catch (_) {}
      }
      status.textContent = '대기 중';
      status.className = '';
      startBtn.disabled = false; stopBtn.disabled = true;
      render('');
    };

    return r;
  }

  /* ---------- 이벤트 ---------- */
  startBtn.onclick = async () => {
    manualStop = false;
    await getTranslator();                 // 모델 미리 준비
    recognition = build();
    try { recognition.start(); }
    catch (e) { status.textContent = '시작 실패: ' + e.message; }
  };

  stopBtn.onclick = () => { manualStop = true; if (recognition) recognition.stop(); };

  $('clear').onclick = () => { srcSentences = []; enSentences = []; render(''); };

  $('copy').onclick = () => {
    navigator.clipboard.writeText(enSentences.filter(Boolean).join(' ')).then(() => {
      const old = status.textContent;
      status.textContent = '영어 번역문이 복사되었습니다.';
      setTimeout(() => { status.textContent = old; }, 1500);
    });
  };

  $('lang').onchange = () => {
    translator = null; translatorLang = null;
    $('srcTitle').textContent = '원문 (' + $('lang').selectedOptions[0].textContent + ')';
    if (recognition) { manualStop = true; recognition.stop(); }
  };
})();
</script>
</body>
</html>
